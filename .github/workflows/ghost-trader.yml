name: GHOST AI Trader · Spot Testnet e Pages
on:
  push:
    branches: [main]
    paths: [index.html, engine.mjs, runner.mjs, .github/workflows/ghost-trader.yml]
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'
permissions:
  contents: read
concurrency:
  group: ghost-trader-main
  cancel-in-progress: false
jobs:
  simulate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.persist.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testar o motor e os dois modos de simulação
        run: node runner.mjs --self-test
      - name: Diagnosticar ligação WebSocket oficial
        if: github.event_name == 'workflow_dispatch'
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import { request } from 'node:https';
          const host = 'ws-api.testnet.binance.vision';
          const path = '/ws-api/v3';

          function handshake(port) {
            return new Promise(resolve => {
              const req = request({hostname:host,port,path,headers:{
                Connection:'Upgrade', Upgrade:'websocket',
                'Sec-WebSocket-Version':'13',
                'Sec-WebSocket-Key':randomBytes(16).toString('base64'),
              }});
              const timer=setTimeout(()=>req.destroy(new Error('Timeout')),8000);
              const finish=value=>{clearTimeout(timer);resolve(value);};
              req.once('upgrade',(res,socket)=>{socket.destroy();finish(res.statusCode);});
              req.once('response',res=>{res.resume();finish(res.statusCode);});
              req.once('error',err=>finish(err.code||err.message));
              req.end();
            });
          }

          function checkTime(port) {
            return new Promise(resolve=>{
              const socket=new WebSocket('wss://'+host+':'+port+path);
              const finish=result=>{clearTimeout(timer);socket.close();resolve(result);};
              const timer=setTimeout(()=>finish(false),8000);
              socket.addEventListener('open',()=>socket.send(JSON.stringify({id:'testnet-time',method:'time'})),{once:true});
              socket.addEventListener('message',event=>{
                let reply;
                try {reply=JSON.parse(event.data);} catch {finish(false);return;}
                finish(reply.id==='testnet-time' && reply.status===200 && Number.isSafeInteger(reply.result?.serverTime));
              },{once:true});
              socket.addEventListener('error',()=>finish(false),{once:true});
            });
          }

          for(const port of [443,9443]) {
            const result=await handshake(port);
            console.log(host+':'+port+' — '+(typeof result==='number'?'HTTP ':'')+result);
            if(result===101)console.log('Hora oficial da Spot Testnet: '+(await checkTime(port)?'confirmada':'sem resposta válida'));
          }
          NODE
      - name: Consultar a Spot Testnet e simular operações
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
        run: node runner.mjs
      - name: Guardar o histórico fictício
        id: persist
        env:
          EVENT: ${{ github.event_name }}
        run: |
          publish=true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Registar simulação Spot Testnet'
            git push origin HEAD:main
          elif [ "$EVENT" = schedule ]; then
            publish=false
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Preparar o painel público
        if: steps.persist.outputs.publish == 'true'
        run: |
          install -d _site/data
          cp index.html engine.mjs _site/
          cp data/report.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        if: steps.persist.outputs.publish == 'true'
        with:
          path: _site
  publish:
    needs: simulate
    if: needs.simulate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
